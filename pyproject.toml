[project]
name = "anonymous-question-box-python-backend"
version = "0.1.0"
description = "Canonical FastAPI/Pydantic backend for anonymous-question-box"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyJWT>=2.8",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["aqbox"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "PT", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0",
    "ruff>=0.15.13",
    "types-pyjwt>=1.7.1",
    "types-pyyaml>=6.0.12.20260510",
]
