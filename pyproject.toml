[project]
name = "anonymous-question-box-python-backend"
version = "0.1.0"
description = "FastAPI/Pydantic rewrite of anonymous-question-box backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "PyJWT>=2.8",
  "PyYAML>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python_backend"}
packages = ["aqbox"]

[tool.pytest.ini_options]
testpaths = ["python_backend/tests"]
pythonpath = ["python_backend"]
