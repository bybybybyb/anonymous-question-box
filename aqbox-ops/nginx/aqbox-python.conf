# AQBox Python backend reverse proxy snippet.
#
# Include this inside the production server block and keep the Python backend
# bound to a private interface or Unix socket. The backend only trusts these
# forwarded IP headers when the direct peer is listed in trusted_proxy_cidrs.

location /api/ {
    proxy_pass http://127.0.0.1:3768/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
